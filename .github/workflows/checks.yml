name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: PYTHONPATH=python python -m unittest discover -s tests -p 'test_*.py'
      - run: PYTHONPATH=python python -m aurum public/sample.csv --out /tmp/aurum-analysis --synthetic
