name: Import prepared source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract prepared source
        env:
          EXPECTED_SHA256: "1cfaf87d75a4c8264c245c3e0d1d2bb2a63618d8d653297e7d8fa11e27063343"
        run: |
          python - <<'PYCODE'
          import hashlib, os, zipfile, base64, io
          from pathlib import Path
          archive=Path('aurum-source.b64')
          payload=base64.b64decode(archive.read_bytes())
          assert hashlib.sha256(payload).hexdigest()==os.environ['EXPECTED_SHA256'], 'Archive checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              for item in z.infolist():
                  p=Path(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '.github' not in p.parts
              z.extractall('.')
          archive.unlink()
          PYCODE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: PYTHONPATH=python python -m unittest discover -s tests -p 'test_*.py'
      - name: Publish verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add verified Aurum application, analytics and documentation'
          git push
